<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuroTropic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>

  <div class="hero">
    <h1 class="title">NEUROTROPIC</h1>

    <a class="play-btn" href="game.html" aria-label="Jogar Tic Tac Toe">
      <svg viewBox="0 0 90 90" aria-hidden="true">
        <path class="grid-lines" d="M30 4V86M60 4V86M4 30H86M4 60H86" />
        <g id="marks"></g>
        <path id="win-line" class="win-line" />
      </svg>
      <span>JOGAR</span>
    </a>
  </div>

  <script>
    // Mini-partidas que se desenham sozinhas dentro do botão.
    (() => {
      const GAMES = [
        { moves: [4, 0, 2, 8, 6], win: [2, 6] },
        { moves: [0, 4, 1, 2, 3, 6], win: [2, 6] }, // O vence na diagonal
        { moves: [4, 1, 0, 8, 6, 2, 3], win: [0, 6] },
      ];
      const marks = document.getElementById("marks");
      const line = document.getElementById("win-line");
      const NS = "http://www.w3.org/2000/svg";
      const c = (i) => [15 + (i % 3) * 30, 15 + Math.floor(i / 3) * 30];

      function mark(i, player) {
        const [x, y] = c(i);
        const el = document.createElementNS(NS, player === "X" ? "path" : "circle");
        if (player === "X") el.setAttribute("d", `M${x - 9} ${y - 9}L${x + 9} ${y + 9}M${x + 9} ${y - 9}L${x - 9} ${y + 9}`);
        else { el.setAttribute("cx", x); el.setAttribute("cy", y); el.setAttribute("r", 9); }
        el.setAttribute("class", `mark ${player.toLowerCase()}`);
        el.setAttribute("pathLength", 1);
        marks.appendChild(el);
      }

      function drawLine([a, b]) {
        const [x1, y1] = c(a), [x2, y2] = c(b);
        const dx = Math.sign(x2 - x1) * 10, dy = Math.sign(y2 - y1) * 10;
        line.setAttribute("d", `M${x1 - dx} ${y1 - dy}L${x2 + dx} ${y2 + dy}`);
        line.setAttribute("pathLength", 1);
        line.classList.add("on");
      }

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

      async function loop() {
        for (let g = 0; ; g = (g + 1) % GAMES.length) {
          marks.replaceChildren();
          line.classList.remove("on");
          const { moves, win } = GAMES[g];
          for (let k = 0; k < moves.length; k++) {
            mark(moves[k], k % 2 ? "O" : "X");
            if (!still) await sleep(420);
          }
          drawLine(win);
          if (still) return; // sem animação: mostra só a partida final
          await sleep(1800);
        }
      }
      loop();
    })();
  </script>
</body>
</html>
